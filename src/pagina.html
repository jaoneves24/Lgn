<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tela de Cadastro</title>

<style>

body{
    background: linear-gradient(
        45deg, 
        #a57d52 25%, 
        #c1a076 25%, 
        #c1a076 50%, 
        #a57d52 50%, 
        #a57d52 75%, 
        #c1a076 75%
    );

    background-size: 60px 60px;
    display:flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
}

#loguin{
    background:#844420;
    width: 850px;
    height: 350px;
    display: flex;
    justify-content: center;
    align-items:center;
    border-radius: 20px;
    box-shadow: 4px 15px 35px #844420;
}

form{
    display:flex;
    flex-direction: column;
    align-items: center;
}

h1{
    color:white;
    text-align: center;
    font-size: 40px;
    margin-bottom: 40px;
}

/* CAMPOS HORIZONTAIS */
#cxtx{
    display:flex;
    flex-direction: row;
    gap: 20px;
    align-items: center;
}

#cxtx input{
    border:none;
    color:black;
    background-color: #c1a076;
    border-radius: 20px;
    height: 50px;
    font-size: 16px;
    text-align: center;
    outline: none;
}

/* TAMANHOS DOS CAMPOS */
#nome{
    width: 350px;
}

#quantidade{
    width: 80px;
}

#valor{
    width: 120px;
}

#cxtx input::placeholder{
    color:black;
}

#cxtx input:hover{
    transform: translateY(-2px);
}

#botoes{
    display:flex;
    flex-direction: row;
    gap:40px;
    margin-top: 50px;
}

#btv, #btl{
    height: 45px;
    width: 130px;
    cursor:pointer;
    border: none;
    border-radius: 10px;
    color:white;
    font-size: 16px;
    transition: 0.3s;
}

/* BOTÃO CONFIRMAR */
#btv{
    background-color: green;
}

#btv:hover { 
    transform: translateY(-2px);
    background-color: #00b300;
    box-shadow: 0 5px 15px rgb(0, 80, 0);
}

/* BOTÃO EXCLUIR */
#btl{
    background-color: red;
}

#btl:hover { 
    transform: translateY(-2px);
    background-color: #ff1a1a;
    box-shadow: 0 5px 15px rgb(120, 0, 0);
}

</style>
</head>

<body>

<div id="loguin">

    <form method="POST">

        <h1>Cadastro</h1>

        <div id="cxtx">

            <input 
                type="text" 
                name="nome" 
                id="nome"
                placeholder="Nome"
                maxlength="50"
            >

            <input 
                type="number" 
                name="quantidade" 
                id="quantidade"
                placeholder="Qtd"
                maxlength="3"
            >

            <input 
                type="number" 
                step="0.01" 
                name="valor" 
                id="valor"
                placeholder="Valor"
                maxlength="6"
            >

        </div>

        <div id="botoes">

            <button type="reset" id="btl">Excluir</button>

            <button type="submit" id="btv">Confirmar</button>

        </div>

    </form>

</div>

</body>
</html>
